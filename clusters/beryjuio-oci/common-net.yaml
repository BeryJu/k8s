apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beryjuorg-common-net
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./common-net
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    - target:
        kind: HelmRelease
        name: istio-ingressgateway
      patch: |-
        - op: replace
          path: /spec/values/autoscaling/minReplicas
          value: 1
        - op: replace
          path: /spec/values/autoscaling/maxReplicas
          value: 2
    - target:
        kind: HelmRelease
        name: istio-eastwestgateway
      patch: |-
        - op: replace
          path: /spec/values/autoscaling/minReplicas
          value: 1
        - op: replace
          path: /spec/values/autoscaling/maxReplicas
          value: 2
