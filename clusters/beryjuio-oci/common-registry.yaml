apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beryjuorg-common-registry
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./common-registry
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    - target:
        kind: HorizontalPodAutoscaler
        namespace: registry
      patch: |-
        - op: replace
          path: /spec/maxReplicas
          value: 2
        # shrink-cpu-requests sets requests to 1m, so Utilization targets are meaningless here
        - op: replace
          path: /spec/metrics/0/resource/target
          value:
            type: AverageValue
            averageValue: 100m
