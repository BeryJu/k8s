---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: shrink-cpu-requests
spec:
  rules:
    - name: floor-cpu-requests
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - kyverno
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    cpu: "1m"
