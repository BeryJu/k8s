apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: beryju-io-incus
  namespace: istio-system
spec:
  issuerRef:
    name: letsencrypt-prod
    group: cert-manager.io
    kind: ClusterIssuer
  secretName: beryju-io-incus
  commonName: incus.${CLUSTER_NAME}.k8s.beryju.io
  dnsNames:
    - incus.${CLUSTER_NAME}.k8s.beryju.io
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: beryju-io-gw-incus
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: beryju-io-incus
      hosts:
        - incus.${CLUSTER_NAME}.k8s.beryju.io
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - incus.${CLUSTER_NAME}.k8s.beryju.io
      tls:
        httpsRedirect: true
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: beryju-io-vs-incus
  namespace: istio-system
spec:
  gateways:
    - beryju-io-gw-incus
  hosts:
    - incus.${CLUSTER_NAME}.k8s.beryju.io
  http:
    - route:
        - destination:
            port:
              number: 8888
            host: proxy-incus.istio-system.svc.cluster.local
