apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring-system
spec:
  timeout: 30m
  interval: 6h
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 9.21.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    image:
      repository: proxy.registry.beryju.io/prom/snmp-exporter
    serviceMonitor:
      enabled: true
      namespace: monitoring-system
      params:
        - name: slow-one
          module:
            - if_mib
          target: 192.168.8.129
          interval: 1m
          scrapeTimeout: 1m
        - name: fast-one
          module:
            - if_mib
          target: 192.168.8.130
          interval: 1m
          scrapeTimeout: 1m
