kind: Service
apiVersion: v1
metadata:
  name: beryju-io-prom-gravity
  labels:
    svc: beryju-io-prom-gravity
  namespace: monitoring-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8009
      targetPort: 8009
---
kind: Endpoints
apiVersion: v1
metadata:
  name: beryju-io-prom-gravity
  namespace: monitoring-system
subsets:
  - addresses:
      - ip: 192.168.8.1
    ports:
      - name: http
        port: 8009
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beryju-io-prom-gravity
  namespace: monitoring-system
spec:
  endpoints:
    - interval: 30s
      port: http
  selector:
    matchLabels:
      svc: beryju-io-prom-gravity
