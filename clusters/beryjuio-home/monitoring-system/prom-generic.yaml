kind: Service
apiVersion: v1
metadata:
  name: beryju-io-prom-nodes
  labels:
    svc: beryju-io-prom-nodes
  namespace: monitoring-system
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
kind: Endpoints
apiVersion: v1
metadata:
  name: beryju-io-prom-nodes
  namespace: monitoring-system
subsets:
  - addresses:
      - ip: 192.168.8.30 # nas1
      - ip: 192.168.8.240 # hass1 (node)
      - ip: 192.168.8.50 # inucs (legacy)
    ports:
      - name: metrics
        port: 9100
  - addresses:
      - ip: 192.168.8.145 # kvm k8s
    ports:
      - name: metrics
        port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beryju-io-prom-nodes
  namespace: monitoring-system
spec:
  endpoints:
    - interval: 30s
      port: metrics
      scheme: http
  selector:
    matchLabels:
      svc: beryju-io-prom-nodes
