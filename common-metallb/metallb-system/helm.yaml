apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 6h
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  values:
    prometheus:
      serviceMonitor:
        enabled: true
      namespace: monitoring-system
      # Service account used by prometheus agent
      serviceAccount: beryjuio-prometheus-agent
    frr-k8s:
      prometheus:
        serviceMonitor:
          enabled: true
